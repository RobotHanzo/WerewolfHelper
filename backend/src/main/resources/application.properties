spring.application.name=werewolf-helper

# --- MongoDB ---
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/werewolf}
spring.data.mongodb.auto-index-creation=true

# --- Session: persisted in MongoDB via org.mongodb:mongodb-spring-session (@EnableMongoHttpSession
#     in SessionConfig). This module is annotation-driven, NOT Boot's spring.session.store-type —
#     these keys feed the SessionRepositoryCustomizer in SessionConfig. ---
werewolf.session.collection-name=dashboard_sessions
werewolf.session.timeout=7d

# --- i18n (default + first locale: zh-TW) ---
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- OpenAPI / Scalar ---
springdoc.scalar.path=/scalar
springdoc.api-docs.path=/v3/api-docs

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null

# --- Discord (all optional; bot layer degrades gracefully when absent) ---
werewolf.discord.token=${DISCORD_TOKEN:}
werewolf.discord.client-id=${DISCORD_CLIENT_ID:}
werewolf.discord.client-secret=${DISCORD_CLIENT_SECRET:}
werewolf.discord.redirect-uri=${DISCORD_REDIRECT_URI:http://localhost:8080/api/auth/callback}
werewolf.discord.server-creators=${DISCORD_SERVER_CREATORS:}

# --- Dashboard ---
werewolf.dashboard.base-url=${DASHBOARD_BASE_URL:http://localhost:5173}

server.port=${PORT:8080}
