spring.application.name=werewolf-helper

# --- MongoDB ---
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/werewolf}
spring.data.mongodb.auto-index-creation=true

# --- Session: persisted in MongoDB via org.mongodb:mongodb-spring-session (@EnableMongoHttpSession
#     in SessionConfig). This module is annotation-driven, NOT Boot's spring.session.store-type —
#     these keys feed the SessionRepositoryCustomizer in SessionConfig. ---
werewolf.session.collection-name=dashboard_sessions
werewolf.session.timeout=7d

# --- i18n (default + first locale: zh-TW) ---
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- OpenAPI / Scalar ---
springdoc.scalar.path=/scalar
springdoc.api-docs.path=/v3/api-docs

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null

# --- Discord (all optional; bot layer degrades gracefully when absent) ---
werewolf.discord.token=${DISCORD_TOKEN:}
werewolf.discord.client-id=${DISCORD_CLIENT_ID:}
werewolf.discord.client-secret=${DISCORD_CLIENT_SECRET:}
# NOTE: the OAuth redirect_uri is now derived per-request from the origin you opened (forwarded
# headers / Origin / Referer), so login works over any LAN/Tailscale host instead of a fixed
# localhost. Register each origin's `<origin>/api/auth/callback` in the Discord developer portal.
# This static value is retained only as a config knob and is no longer read by AuthController.
werewolf.discord.redirect-uri=${DISCORD_REDIRECT_URI:http://localhost:8080/api/auth/callback}
werewolf.discord.server-creators=${DISCORD_SERVER_CREATORS:}

# --- Dashboard ---
# Fallback base URL, used only when the request origin can't be resolved from headers.
werewolf.dashboard.base-url=${DASHBOARD_BASE_URL:http://localhost:5173}

# --- CORS (comma-separated origin patterns; the Vite dev proxy forwards the browser's Origin, so
#     accessing the dashboard over a LAN/Tailscale host needs that origin allowed). Default covers
#     localhost + private + Tailscale (100.64.0.0/10) ranges. ---
werewolf.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://localhost:*,http://127.0.0.1:*,http://192.168.*:*,https://192.168.*:*,http://10.*:*,https://10.*:*,http://100.*:*,https://100.*:*}

server.port=${PORT:8080}
